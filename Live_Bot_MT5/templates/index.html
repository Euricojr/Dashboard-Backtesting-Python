<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoC Live WING26</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
      body {
        font-family: sans-serif;
        background-color: #1e1e1e;
        color: #fff;
        text-align: center;
        margin: 0;
        padding: 20px;
      }
      #chart {
        width: 100%;
        height: 600px;
        margin-top: 20px;
        border: 1px solid #333;
      }
      .header {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      select {
        background: #333;
        color: #fff;
        border: 1px solid #555;
        padding: 5px;
        border-radius: 4px;
        font-size: 1rem;
      }
      .price-display {
        font-size: 2.5rem;
        margin: 5px;
        color: #00e676;
        font-weight: bold;
      }
      .symbol-display {
        font-size: 1.5rem;
        color: #ff9800;
        font-weight: bold;
      }
      .status {
        color: #888;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <!-- Droplist de Ativos -->
      <div class="controls" style="flex-direction: column; align-items: center;">
          <label style="font-size: 1.5rem; font-weight: bold; color: #ff9800;">
            <input list="assetsList" id="symbolSelect" onchange="changeSymbol()" value="WING26" 
                   style="font-size: 1.5rem; font-weight: bold; color: #ff9800; background: #222; border: 1px solid #444; padding: 5px; border-radius: 4px; width: 250px; text-align: center;">
            <datalist id="assetsList">
              {% for asset in assets %}
                <option value="{{ asset }}">
              {% endfor %}
            </datalist>
          </label>
          <div style="font-size: 0.8rem; color: #666; margin-top: 2px;">
            Total: {{ assets|length }} ativos
          </div>
      </div>

      <div class="controls">
        <label
          >Timeframe:
          <select id="timeframeSelect">
            <!-- Populated via JS -->
          </select>
        </label>
        <label
          >Velas:
          <select id="candleCountSelect">
            <option value="100">100</option>
            <option value="500">500</option>
            <option value="1000" selected>1000</option>
            <option value="2000">2000</option>
            <option value="5000">5000</option>
            <option value="10000">10000</option>
          </select>
        </label>
      </div>

      <div
        class="controls"
        style="border-top: 1px solid #444; padding-top: 10px; margin-top: 10px"
      >
        <span style="font-weight: bold; color: #ddd">Backtest (SMA)</span>
        <label
          >Short:
          <input
            type="number"
            id="smaShort"
            value="20"
            style="
              width: 50px;
              background: #333;
              color: white;
              border: 1px solid #555;
            "
        /></label>
        <label
          >Long:
          <input
            type="number"
            id="smaLong"
            value="50"
            style="
              width: 50px;
              background: #333;
              color: white;
              border: 1px solid #555;
            "
        /></label>
        <button
          onclick="runBacktest()"
          style="
            background: #2196f3;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
          "
        >
          Run Backtest
        </button>
      </div>

      <div class="price-display" id="price">--.--</div>
      <div class="status" id="status">Conectando...</div>

      <div
        id="metrics"
        style="
          display: flex;
          gap: 20px;
          justify-content: center;
          margin-top: 10px;
          font-size: 0.9rem;
          color: #aaa;
        "
      >
        <!-- Metrics will appear here -->
      </div>
    </div>

    <div id="chart"></div>

    <script>
      // Inicializa o Gráfico
      const chart = LightweightCharts.createChart(
        document.getElementById("chart"),
        {
          layout: { background: { color: "#1e1e1e" }, textColor: "#DDD" },
          grid: {
            vertLines: { color: "#2b2b43" },
            horzLines: { color: "#2b2b43" },
          },
          timeScale: { timeVisible: true, secondsVisible: false },
          rightPriceScale: { visible: true },
          leftPriceScale: { visible: true, borderColor: "#555" },
        },
      );

      const candleSeries = chart.addCandlestickSeries({
        upColor: "#26a69a",
        downColor: "#ef5350",
        borderVisible: false,
        wickUpColor: "#26a69a",
        wickDownColor: "#ef5350",
      });

      // Series para SMA Short
      const smaShortSeries = chart.addLineSeries({
        color: '#2962FF',
        lineWidth: 2,
        title: 'SMA Short',
      });
      
      // Series para SMA Long
      const smaLongSeries = chart.addLineSeries({
        color: '#FF6D00',
        lineWidth: 2,
        title: 'SMA Long',
      });

      let SYMBOL = document.getElementById("symbolSelect").value;
      let updateInterval = null;

      function changeSymbol() {
        SYMBOL = document.getElementById("symbolSelect").value;
        loadHistory();
      }

      async function init() {
        // Carrega timeframes disponiveis
        try {
          const res = await fetch("/api/timeframes");
          const timeframes = await res.json();
          const select = document.getElementById("timeframeSelect");

          timeframes.forEach((tf) => {
            const opt = document.createElement("option");
            opt.value = tf;
            opt.innerText = tf;
            if (tf === "M5") opt.selected = true;
            select.appendChild(opt);
          });

          // Event Listeners
          select.addEventListener("change", loadHistory);
          document
            .getElementById("candleCountSelect")
            .addEventListener("change", loadHistory);

          // Carrega primeira vez
          loadHistory();
        } catch (e) {
          console.error("Erro ao carregar timeframes", e);
        }
      }

      async function loadHistory() {
        if (updateInterval) clearInterval(updateInterval);

        const tf = document.getElementById("timeframeSelect").value;
        const count = document.getElementById("candleCountSelect").value;
        const statusEl = document.getElementById("status");
        
        // Atualiza SYMBOL caso tenha mudado
        SYMBOL = document.getElementById("symbolSelect").value;

        // Limpa backtest things
        removeMarkers();
        smaShortSeries.setData([]);
        smaLongSeries.setData([]);
        document.getElementById("metrics").innerHTML = "";

        statusEl.innerText = `Baixando histórico (${count} velas de ${tf})...`;
        // Removed symbolDisplay update since it was replaced by dropdown

        try {
          const res = await fetch(
            `/api/history?symbol=${SYMBOL}&timeframe=${tf}&count=${count}`,
          );
          const data = await res.json();

          if (data.error) {
            statusEl.innerText = "Erro: " + data.error;
            return;
          }

          candleSeries.setData(data);
          chart.timeScale().fitContent();

          statusEl.innerText =
            "Histórico carregado. Iniciando sincronização tempo real...";

          if (data.length > 0) {
            updateDisplay(data[data.length - 1]);
          }

          // Começa loop de update
          updateInterval = setInterval(updateLive, 1000);
        } catch (err) {
          console.error(err);
          statusEl.innerText = "Erro ao carregar histórico.";
        }
      }

      async function runBacktest() {
        const tf = document.getElementById("timeframeSelect").value;
        const count = document.getElementById("candleCountSelect").value;
        const short = document.getElementById("smaShort").value;
        const long = document.getElementById("smaLong").value;
        const statusEl = document.getElementById("status");

        statusEl.innerText = "Rodando Backtest...";

        try {
          const res = await fetch(
            `/api/backtest?symbol=${SYMBOL}&timeframe=${tf}&count=${count}&short=${short}&long=${long}`,
          );
          const data = await res.json();

          if (data.error) {
            statusEl.innerText = "Erro Backtest: " + data.error;
            return;
          }

          // Plot Markers
          candleSeries.setMarkers(data.markers);

          // Plot SMAs
          smaShortSeries.setData(data.sma_short);
          smaLongSeries.setData(data.sma_long);

          // Show Metrics
          const m = data.metrics;
          const t = data.trade_stats;

          const metricsHtml = `
                <div>Retorno Total: <span style="color: ${m["Total Return"] >= 0 ? "#00e676" : "#ff1744"}">${(m["Total Return"] * 100).toFixed(2)}%</span></div>
                <div>Trades: ${t.total_trades}</div>
                <div>Win Rate: ${(t.win_rate * 100).toFixed(1)}%</div>
                <div>Profit Factor: ${t.profit_factor.toFixed(2)}</div>
                <div>Sharpe: ${m["Sharpe Ratio (per bar)"].toFixed(2)}</div>
              `;
          document.getElementById("metrics").innerHTML = metricsHtml;

          statusEl.innerText = "Backtest Concluído.";
        } catch (e) {
          console.error(e);
          statusEl.innerText = "Erro ao rodar backtest.";
        }
      }

      function removeMarkers() {
        candleSeries.setMarkers([]);
      }

      async function updateLive() {
        const tf = document.getElementById("timeframeSelect").value;
        try {
          const res = await fetch(
            `/api/candle?symbol=${SYMBOL}&timeframe=${tf}`,
          );
          const candle = await res.json();

          if (candle.error) return;

          candleSeries.update(candle);
          updateDisplay(candle);

          document.getElementById("status").innerText = "• Ao Vivo";
        } catch (err) {
          console.error("Erro no live update:", err);
        }
      }

      function updateDisplay(candle) {
        const priceEl = document.getElementById("price");
        priceEl.innerText = `${candle.close.toFixed(0)}`;
        priceEl.style.color =
          candle.close >= candle.open ? "#00e676" : "#ff1744";
      }

      // Iniciar
      window.onload = init;
    </script>
  </body>
</html>

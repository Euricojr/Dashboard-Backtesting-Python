<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC Live WING26</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #1e1e1e; color: #fff; text-align: center; margin: 0; padding: 20px; }
        #chart { width: 100%; height: 600px; margin-top: 20px; border: 1px solid #333; }
        .header { margin-bottom: 20px; }
        .price-display { font-size: 2.5rem; margin: 5px; color: #00e676; font-weight: bold; }
        .symbol-display { font-size: 1.5rem; color: #ff9800; font-weight: bold; }
        .status { color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header">
        <div class="symbol-display">WING26 (Mini Índice - 5 Min)</div>
        <div class="price-display" id="price">--.--</div>
        <div class="status" id="status">Conectando...</div>
    </div>
    
    <div id="chart"></div>

    <script>
        // Inicializa o Gráfico
        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { background: { color: '#1e1e1e' }, textColor: '#DDD' },
            grid: { vertLines: { color: '#2b2b43'}, horzLines: { color: '#2b2b43' } },
            timeScale: { timeVisible: true, secondsVisible: false },
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
            wickUpColor: '#26a69a', wickDownColor: '#ef5350'
        });

        const SYMBOL = "WING26";

        async function loadHistory() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Baixando histórico de 1000 velas...";
            
            try {
                const res = await fetch(`/api/history?symbol=${SYMBOL}`);
                const data = await res.json();

                if (data.error) {
                    statusEl.innerText = "Erro: " + data.error;
                    console.error("API Error:", data.error);
                    return;
                }

                candleSeries.setData(data);
                chart.timeScale().fitContent();
                
                statusEl.innerText = "Histórico carregado. Iniciando sincronização tempo real...";
                
                // Atualiza preço inicial
                if(data.length > 0) {
                    const last = data[data.length - 1];
                    updateDisplay(last);
                }

                // Começa loop de update
                setInterval(updateLive, 1000);

            } catch (err) {
                console.error(err);
                statusEl.innerText = "Erro de conexão ao carregar histórico.";
            }
        }

        async function updateLive() {
            try {
                const res = await fetch(`/api/candle?symbol=${SYMBOL}`);
                const candle = await res.json();

                if (candle.error) return;

                candleSeries.update(candle);
                updateDisplay(candle);
                
                document.getElementById('status').innerText = "• Ao Vivo";

            } catch (err) {
                console.error("Erro no live update:", err);
            }
        }

        function updateDisplay(candle) {
            const priceEl = document.getElementById('price');
            priceEl.innerText = `${candle.close.toFixed(0)}`; // Índice geralmente não tem centavos ou tem 00/05 fixo.
            priceEl.style.color = candle.close >= candle.open ? '#00e676' : '#ff1744';
        }

        // Iniciar
        window.onload = loadHistory;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestDashboard PRO | Eurico Júnior</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0e1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent: #00d4ff;
            --text-gray: #8b949e;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #c9d1d9; 
            font-family: 'Outfit', sans-serif;
        }

        .sidebar { 
            background-color: var(--card-bg); 
            min-height: 100vh; 
            padding: 25px; 
            border-right: 1px solid var(--border-color); 
        }

        .card { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            color: white; 
            border-radius: 12px;
            margin-bottom: 20px;
        }

        #chart { 
            width: 100%; 
            height: 500px; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid var(--border-color); 
        }

        .metric-label { color: var(--text-gray); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .metric-value { font-size: 1.4rem; font-weight: 600; color: var(--accent); }
        
        .ai-box {
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            line-height: 1.6;
            border-left: 5px solid var(--accent);
        }
        .ai-info { background: rgba(0, 212, 255, 0.1); border-color: var(--accent); }
        .ai-warning { background: rgba(255, 171, 0, 0.1); border-color: #ffab00; }

        footer {
            text-align: center;
            padding: 40px;
            color: #6e7681;
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }

        select.form-control { background-color: #1c2128; color: white; border: 1px solid var(--border-color); }
        input.form-control { background-color: #1c2128; color: white; border: 1px solid var(--border-color); }
        
        table { color: #c9d1d9 !important; }
        th { color: var(--text-gray); font-weight: 400; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 sidebar">
                <h3 class="mb-4">🎯 Configurações</h3>
                
                <div class="mb-3">
                    <label class="mb-2">Escolha o Ativo</label>
                    <select id="asset_select" class="form-control mb-2">
                        <option value="PETR4.SA">Petrobras (PETR4.SA)</option>
                    </select>
                    <div id="custom_ticker_div" style="display: none;">
                        <input type="text" id="custom_ticker" class="form-control" placeholder="Digite o Ticker (Ex: AAPL)">
                    </div>
                </div>
                
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label>Início</label>
                        <input type="date" id="start_date" class="form-control" value="2020-01-01">
                    </div>
                    <div class="col-6">
                        <label>Fim</label>
                        <input type="date" id="end_date" class="form-control" value="2024-01-01">
                    </div>
                </div>

                <button id="run_btn" class="btn btn-primary w-100 mb-4 py-2 fw-bold">🚀 EXECUTAR BACKTEST</button>

                <div id="quick_metrics" style="display: none;">
                    <h5>📊 Resumo OOS</h5>
                    <div class="card p-3 mb-2">
                        <div class="metric-label">Retorno Total</div>
                        <div id="m_total" class="metric-value">-</div>
                    </div>
                    <div class="card p-3">
                        <div class="metric-label">Sharpe Ratio</div>
                        <div id="m_sharpe" class="metric-value">-</div>
                    </div>
                </div>
            </div>

            <!-- Main Area -->
            <div class="col-md-9 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="mb-0">📈 Dashboard Quantitativo</h2>
                </div>

                <div id="chart"></div>
                
                <div id="results_area" style="display: none;">
                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card p-4">
                                <h5 class="mb-4">Relatório de Performance</h5>
                                <table class="table table-dark table-hover mb-0">
                                    <thead>
                                        <tr>
                                            <th>Métrica</th>
                                            <th>Treino (In-Sample)</th>
                                            <th>Teste (Out-of-Sample)</th>
                                        </tr>
                                    </thead>
                                    <tbody id="metrics_table_body">
                                        <!-- Preenchido via JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- AI Interpretation -->
                    <div id="ai_container" class="ai-box">
                        <!-- Conteúdo da IA aqui -->
                    </div>
                </div>

                <footer>
                    Projeto de Backtesting Quantitativo | Desenvolvido por <b>Eurico Júnior</b>
                </footer>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="script.js"></script>
</body>
</html>
